<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlowAssert — evidence-based workflow verification (research preview, demo data)." />
    <title>FlowAssert</title>
    <script>
      try {
        var p = localStorage.getItem("flowassert.theme");
        var d = p === "dark" || ((!p || p === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
