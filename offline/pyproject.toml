[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowassert-offline"
description = "Compare a source CSV with a destination export, and refuse to say Verified without enough evidence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Sun-sh902/FlowAssert"

[project.scripts]
flowassert-verify = "flowassert_offline.cli:main"

[tool.setuptools]
packages = ["flowassert_offline"]

[tool.setuptools.dynamic]
version = { attr = "flowassert_offline.__version__" }
