name: I tried FlowAssert
description: Tell us how a first check went, where you got stuck, and whether the result was clear.
title: "Trial feedback: "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying FlowAssert. Only what you wanted to check is required; a few words help.

        **Do not paste real data, keys, values, column names you would not share, or reports.** This issue is public. Describe what happened in your own words, or use the synthetic scenarios in `offline/examples/scenarios/`.
  - type: checkboxes
    id: used
    attributes:
      label: How you used it
      options:
        - label: Command line (flowassert-verify)
        - label: Browser, the online demo
        - label: Browser, run locally
        - label: GitHub Action
        - label: n8n example
  - type: textarea
    id: goal
    attributes:
      label: What you wanted to check
      description: For example "that a nightly sync wrote every order to the CRM". No real names or values.
    validations:
      required: true
  - type: textarea
    id: stuck
    attributes:
      label: Where you got stuck
      description: A step that was unclear, a refusal, an option you could not find. Quote a refusal message only if it holds no real value.
  - type: dropdown
    id: result
    attributes:
      label: What the result told you
      options:
        - Verified
        - Mismatch
        - Unverified
        - Refused
        - I did not get a result
  - type: dropdown
    id: clear
    attributes:
      label: Was it clear why?
      options:
        - Yes
        - Partly
        - No
  - type: textarea
    id: unclear
    attributes:
      label: What would have made it clearer
  - type: input
    id: version
    attributes:
      label: Version, if you know it
      description: The output of `flowassert-verify --version`, or the tag of the Action.

