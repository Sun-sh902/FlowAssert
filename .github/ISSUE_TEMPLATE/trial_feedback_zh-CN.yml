name: 试用反馈（中文）
description: 告诉我们第一次核对是否顺利、卡在哪里、结果是否清楚。
title: "试用反馈："
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        感谢试用 FlowAssert。只有“你想核对什么”是必填的；几句话就很有帮助。

        **请不要粘贴真实数据、键、值、不便公开的列名或报告。** 这个 Issue 是公开的。请用自己的话描述发生了什么，或使用 `offline/examples/scenarios/` 中的合成场景。
  - type: checkboxes
    id: used
    attributes:
      label: 你是怎么用的
      options:
        - label: 命令行（flowassert-verify）
        - label: 浏览器：在线演示
        - label: 浏览器：本地运行
        - label: GitHub Action
        - label: n8n 示例
  - type: textarea
    id: goal
    attributes:
      label: 你想核对什么
      description: 例如“每晚同步是否把每个订单都写进了 CRM”。不要写真实名称或值。
    validations:
      required: true
  - type: textarea
    id: stuck
    attributes:
      label: 卡在哪里
      description: 不清楚的步骤、被拒绝的核对、找不到的选项。只有在拒绝消息不含真实值时才引用它。
  - type: dropdown
    id: result
    attributes:
      label: 结果是什么
      options:
        - Verified
        - Mismatch
        - Unverified
        - 被拒绝
        - 没有得到结果
  - type: dropdown
    id: clear
    attributes:
      label: 原因清楚吗
      options:
        - 清楚
        - 部分清楚
        - 不清楚
  - type: textarea
    id: unclear
    attributes:
      label: 怎样会更清楚
  - type: input
    id: version
    attributes:
      label: 版本（如果知道）
      description: "`flowassert-verify --version` 的输出，或 Action 的标签。"
