name: Action self-test

# Runs the Action of this repository (uses: ./) on Linux, macOS and Windows, against offline/examples/ and a few
# golden cases: one Verified, one Mismatch, one Unverified, and two refusals (one by the checker, one by the Action).
# It checks the state and exit-code outputs, that a step fails exactly when its fail-on says so (with
# continue-on-error, then the step's outcome), and that the reports are the golden reports apart from evaluated_at.
# From 1.1.0 also: a workbook source with the records to resend, whose files must be the command line's, and a check
# from a Google Sheets range to HubSpot through the local fakes (scripts/dev/serve_fakes.py, on loopback ports),
# with recognisable fake credentials that must appear in no output, report or exported file. Nothing contacts Google
# or HubSpot.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: Action on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS on Intel: in November 2026 GitHub's macOS arm64 runners did not take this job for lack of capacity.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python: ["3.13"]
        include:
          # The oldest Python the checker supports. It has no build for Ubuntu 26.04, which ubuntu-latest became in
          # November 2026, so it runs on 24.04.
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      # The golden files are compared byte for byte, so Windows must not turn their line endings into CR LF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Verified (golden rules-pass)
        id: verified
        uses: ./
        with:
          source: offline/golden/rules-pass/source.csv
          destination: offline/golden/rules-pass/destination.csv
          config: offline/golden/rules-pass/config.json
          source-encoding: utf-8
          destination-encoding: utf-8
          source-complete: "true"
          destination-complete: "true"
          json: verified.json
          html: verified.html
      - name: Check the Verified step
        shell: bash
        env:
          STATE: ${{ steps.verified.outputs.state }}
          CODE: ${{ steps.verified.outputs.exit-code }}
          JSON: ${{ steps.verified.outputs.json }}
          HTML: ${{ steps.verified.outputs.html }}
        run: |
          test "$STATE" = Verified
          test "$CODE" = 0
          test "$JSON" = verified.json
          test "$HTML" = verified.html
          python scripts/dev/check_action_report.py offline/golden/rules-pass "$JSON" "$HTML"

      - name: Mismatch (offline/examples, golden example), fails even with fail-on mismatch
        id: mismatch
        continue-on-error: true
        uses: ./
        with:
          source: offline/examples/source.csv
          destination: offline/examples/destination.csv
          key: external_id
          fields: |
            phone
            email:hs_email
          source-complete: "true"
          destination-complete: "true"
          fail-on: mismatch
          json: mismatch.json
          html: mismatch.html
      - name: Check the Mismatch step
        shell: bash
        env:
          OUTCOME: ${{ steps.mismatch.outcome }}
          STATE: ${{ steps.mismatch.outputs.state }}
          CODE: ${{ steps.mismatch.outputs.exit-code }}
        run: |
          test "$OUTCOME" = failure
          test "$STATE" = Mismatch
          test "$CODE" = 1
          python scripts/dev/check_action_report.py offline/golden/example mismatch.json mismatch.html

      - name: Unverified (golden duplicate-source-key), fails with the default fail-on
        id: unverified
        continue-on-error: true
        uses: ./
        with:
          source: offline/golden/duplicate-source-key/source.csv
          destination: offline/golden/duplicate-source-key/destination.csv
          config: offline/golden/duplicate-source-key/config.json
          source-encoding: utf-8
          destination-encoding: utf-8
          source-complete: "true"
          destination-complete: "true"
          show-records: "true"
      - name: Unverified again, passes with fail-on mismatch
        id: unverified-allowed
        continue-on-error: true
        uses: ./
        with:
          source: offline/golden/duplicate-source-key/source.csv
          destination: offline/golden/duplicate-source-key/destination.csv
          config: offline/golden/duplicate-source-key/config.json
          source-complete: "true"
          destination-complete: "true"
          fail-on: mismatch
      - name: Check the Unverified steps
        shell: bash
        env:
          OUTCOME: ${{ steps.unverified.outcome }}
          STATE: ${{ steps.unverified.outputs.state }}
          CODE: ${{ steps.unverified.outputs.exit-code }}
          ALLOWED_OUTCOME: ${{ steps.unverified-allowed.outcome }}
          ALLOWED_STATE: ${{ steps.unverified-allowed.outputs.state }}
        run: |
          test "$OUTCOME" = failure
          test "$STATE" = Unverified
          test "$CODE" = 3
          test "$ALLOWED_OUTCOME" = success
          test "$ALLOWED_STATE" = Unverified

      - name: Refused by the checker (golden refused-missing-columns), even with fail-on mismatch
        id: refused
        continue-on-error: true
        uses: ./
        with:
          source: offline/golden/refused-missing-columns/source.csv
          destination: offline/golden/refused-missing-columns/destination.csv
          config: offline/golden/refused-missing-columns/config.json
          fail-on: mismatch
          json: refused.json
      - name: Refused by the Action (a premise that is not exactly true or false)
        id: refused-input
        continue-on-error: true
        uses: ./
        with:
          source: offline/examples/source.csv
          destination: offline/examples/destination.csv
          key: external_id
          fields: phone
          source-complete: "yes"
      - name: Check the refused steps
        shell: bash
        env:
          OUTCOME: ${{ steps.refused.outcome }}
          STATE: ${{ steps.refused.outputs.state }}
          CODE: ${{ steps.refused.outputs.exit-code }}
          JSON: ${{ steps.refused.outputs.json }}
          INPUT_OUTCOME: ${{ steps.refused-input.outcome }}
          INPUT_STATE: ${{ steps.refused-input.outputs.state }}
          INPUT_CODE: ${{ steps.refused-input.outputs.exit-code }}
        run: |
          test "$OUTCOME" = failure
          test "$STATE" = refused
          test "$CODE" = 2
          test -z "$JSON"
          test ! -e refused.json
          test "$INPUT_OUTCOME" = failure
          test "$INPUT_STATE" = refused
          test "$INPUT_CODE" = 2

      - name: Workbook source with the records to resend (golden xlsx-mismatch)
        id: workbook
        continue-on-error: true
        uses: ./
        with:
          source: offline/golden-xlsx/xlsx-mismatch/source.xlsx
          source-format: xlsx
          destination: offline/golden-xlsx/xlsx-mismatch/destination.csv
          key: external_id
          fields: |
            phone
            email:hs_email
          source-complete: "true"
          destination-complete: "true"
          json: workbook.json
          html: workbook.html
          export-dir: resend-workbook
      - name: Check the workbook step and its files
        shell: bash
        env:
          OUTCOME: ${{ steps.workbook.outcome }}
          STATE: ${{ steps.workbook.outputs.state }}
          EXPORT_DIR: ${{ steps.workbook.outputs.export-dir }}
        run: |
          test "$OUTCOME" = failure
          test "$STATE" = Mismatch
          test "$EXPORT_DIR" = resend-workbook
          python scripts/dev/check_action_report.py offline/golden-xlsx/xlsx-mismatch workbook.json workbook.html
          python offline/verify.py --source offline/golden-xlsx/xlsx-mismatch/source.xlsx --source-format xlsx \
            --destination offline/golden-xlsx/xlsx-mismatch/destination.csv --key external_id --field phone \
            --field email:hs_email --source-complete --destination-complete --export-dir expected-workbook > /dev/null || test $? = 1
          test "$(ls resend-workbook)" = "$(ls expected-workbook)"
          test -n "$(ls resend-workbook)"
          for f in expected-workbook/*; do cmp "$f" "resend-workbook/$(basename "$f")"; done

      - name: Start the local fakes of Google Sheets and HubSpot
        shell: bash
        env:
          FAKE_SHEETS_TOKEN: fake-oauth-token-FA11-LEAK-CANARY-not-a-real-credential
          FAKE_HUBSPOT_TOKEN: pat-na1-fake-FA11-LEAK-CANARY-not-a-real-credential
        run: |
          python scripts/dev/serve_fakes.py --sheets-token "$FAKE_SHEETS_TOKEN" --hubspot-token "$FAKE_HUBSPOT_TOKEN" \
            --env-file "$GITHUB_ENV" --ready fakes-ready --seconds 900 > fakes.log 2>&1 &
          for i in $(seq 1 100); do test -e fakes-ready && break; sleep 0.1; done
          test -e fakes-ready
      - name: Sheet to HubSpot through the local fakes, with the records to resend
        id: connectors
        continue-on-error: true
        uses: ./
        env:
          FLOWASSERT_SHEETS_TOKEN: fake-oauth-token-FA11-LEAK-CANARY-not-a-real-credential
          FLOWASSERT_HUBSPOT_TOKEN: pat-na1-fake-FA11-LEAK-CANARY-not-a-real-credential
        with:
          source-sheet: 1SyntheticSpreadsheet-FlowAssert_0001
          source-range: Leads!A1:C4
          destination-hubspot: contacts
          key: lead_id
          fields: |
            phone
            email
          scope: exact
          source-complete: "true"
          destination-complete: "true"
          json: connectors.json
          html: connectors.html
          export-dir: resend-connectors
          summary-keys: "true"
          show-records: "true"
      - name: Check the connector step, and that no credential was written
        shell: bash
        env:
          OUTCOME: ${{ steps.connectors.outcome }}
          STATE: ${{ steps.connectors.outputs.state }}
          CODE: ${{ steps.connectors.outputs.exit-code }}
          OUTPUTS: ${{ toJSON(steps.connectors.outputs) }}
        run: |
          test "$OUTCOME" = failure
          test "$STATE" = Mismatch
          test "$CODE" = 1
          test -e resend-connectors/missing-from-destination.csv
          test -e resend-connectors/values-differ.csv
          test -e resend-connectors/only-in-destination.csv
          if grep -r -l "LEAK-CANARY" connectors.json connectors.html resend-connectors; then exit 1; fi
          if printf '%s' "$OUTPUTS" | grep -q "LEAK-CANARY"; then exit 1; fi
