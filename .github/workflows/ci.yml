name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline check (Python ${{ matrix.python }})
    # Python 3.9 has no build for Ubuntu 26.04, which ubuntu-latest became in November 2026; it runs on 24.04.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ./offline
      # The checker, the GitHub Action's wrapper around it (action.yml runs it with this Python too), the Google
      # Sheets source and the HubSpot Contacts destination against local fakes (they contact nothing else), the 1.0
      # commitment: the specification's cases, the JSON Schemas against every golden report, and the conformance
      # runner; the workflows themselves, read without a YAML library and compared with Ruby's reader; and the .xlsx
      # reader against independent writers and every golden case a worksheet can hold.
      - run: python -m pytest -q -p no:cacheprovider scripts/dev/tests/test_offline_verify.py scripts/dev/tests/test_action.py scripts/dev/tests/test_sheets_source.py scripts/dev/tests/test_hubspot_destination.py scripts/dev/tests/test_spec.py scripts/dev/tests/test_workflows.py scripts/dev/tests/test_xlsx.py scripts/dev/tests/test_exports.py
      # The browser check is compared with these files byte for byte; here they are only checked, never written. The
      # sheet-sourced cases (offline/golden-sheets/) are checked too, against the same local fake.
      - name: Golden outputs are current
        run: python offline/bench/golden.py --check
      # The reports in the shared cases for comparing two reports (ui/src/test/offline/compare.test.ts).
      - name: Comparison cases are current
        run: python ui/scripts/offline/comparison_cases.py --check
      # docs/schema/ is written by offline/bench/schemas.py, and every case passes the documented conformance command.
      - name: JSON Schemas are current
        run: python offline/bench/schemas.py --check
      - name: Conformance, as docs/conformance.md runs it
        run: python offline/bench/conformance.py --connectors --bytes --html
      - name: Installed command
        run: |
          flowassert-verify --version
          set +e
          flowassert-verify --source offline/examples/source.csv --destination offline/examples/destination.csv \
            --key external_id --field phone --source-complete --destination-complete
          test "$?" -eq 1

  offline-memory:
    name: Offline memory check (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python offline/bench/memory_check.py

  backend:
    name: Backend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m venv service/.venv
      - run: service/.venv/bin/python -m pip install --no-deps -r service/requirements.lock
      - run: /usr/bin/python3 -I -B scripts/dev/check_identities.py
      - name: Tests
        working-directory: service
        run: |
          mkdir -p .runtime/tmp && chmod 700 .runtime .runtime/tmp
          LC_ALL=C PYTHONDONTWRITEBYTECODE=1 TMPDIR="$PWD/.runtime/tmp" .venv/bin/python -B -m pytest -p no:cacheprovider -q \
            --basetemp="$PWD/.runtime/tmp/ci" --deselect tests/test_service.py::test_protected_repository_integrity tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      # The packaged checker, dist-lib/flowassert-check.js, and the n8n example, which must hold exactly this build.
      - run: npm run build:lib
      - name: The n8n example holds this build
        run: node scripts/n8n/build_workflow.mjs --check
      # Includes the bundle test (src/test/offline/bundle.test.ts: this build, run in a node:vm context without crypto,
      # against every golden case the page can run) and the n8n example's test (n8n-workflow.test.ts).
      - run: npx vitest run
      # For the owner to attach to a release; never published from here.
      - uses: actions/upload-artifact@v7
        with:
          name: flowassert-check.js
          path: ui/dist-lib/flowassert-check.js
          if-no-files-found: error

  parity:
    name: Browser check parity (Python 3.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # Conformance cases, golden reports and 300 random cases against the Python checker. The browser follows
      # Python 3.15 where versions differ, so the random cases must not be skipped here.
      - run: npx vitest run src/test/offline/
        working-directory: ui
        env:
          FA_PYTHON: python
          FA_PARITY_REQUIRED: "1"

  browser-check:
    name: CSV check in Chrome
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: google-chrome --version
      # The CSV check, its saved reports and comparisons (real IndexedDB), the Pages build, the first-check help, and
      # an .xlsx workbook on the page.
      - run: npx playwright test e2e/check.spec.ts e2e/check-pages.spec.ts e2e/saved-reports.spec.ts e2e/first-check.spec.ts e2e/html-report.spec.ts e2e/workbook.spec.ts e2e/records-to-resend.spec.ts e2e/english-only.spec.ts --project chrome
