        "required": [
          "snapshot_id",
          "next_cursor",
          "total"
        ],
        "additionalProperties": false,
        "description": "Stable immutable catalog snapshot scoped by workspace, mode and contract version. Cursor additionally binds the full normalized query, sort and evidence run/include_payload option. total=null means not computed, not zero. Evidence pages for a pinned Detail must echo its snapshot, contain references in Detail.evidence_references order, and terminate explicitly; a page is never a partial record verdict inventory."
      },
      "VerificationList": {
        "type": "object",
        "properties": {
          "meta": {
            "$ref": "#/components/schemas/Meta"
