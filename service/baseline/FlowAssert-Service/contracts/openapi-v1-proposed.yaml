{
  "openapi": "3.1.1",
  "jsonSchemaDialect": "https://spec.openapis.org/oas/3.1/dialect/base",
  "info": {
    "title": "FlowAssert API v1 — PROPOSED — NOT IMPLEMENTED",
    "version": "0.1.1-proposed",
    "description": "Phase 0 architecture contract. No backend exists. JSON-compatible YAML 1.2 serialization is intentional so the contract can be parsed without installing YAML packages. Phase 1 is loopback-only LOCAL_RESEARCH, synthetic data, no auth, connectors, database, scheduler or write API. Production authorization is separate from API version and code hashes."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8000",
      "description": "Proposed offline loopback address; no listener created by Phase 0."
    }
  ],
  "security": [],
  "x-contract-status": "PROPOSED — NOT IMPLEMENTED",
  "x-phase1-scope": {
    "provider_mode": "LOCAL_RESEARCH",
    "synthetic": true,
    "research_authorization": "research_only",
    "max_source_rows": 200,
    "max_input_bytes": 1048576,
    "max_overview_workflows": 100,
    "live_available": false,
    "first_slice": [
      "GET /api/v1/verifications/{id}",
      "GET /api/v1/verifications/{id}/evidence"
    ],
    "overview_hydration_max_concurrency": 4
  },
  "x-behavioral-invariants": [
    "Raw ResearchResult is copied unchanged from Python evaluate(e).",
    "Mismatch outranks waiting; row and cohort verdicts are independent returned fields.",
    "Unknown population implies expected_total=null, never an inferred zero.",
    "No GET executes evaluation/acquisition or mutates history.",
    "Query cursors bind immutable snapshot, workspace, mode and full query; expired snapshot returns 409.",
    "Backend errors never render as Verified; no fallback to mocks.",
    "A code digest is identity, not research approval or evidence authenticity."
  ],
  "paths": {
    "/api/v1/overview": {
      "get": {
        "operationId": "getOverview",
        "summary": "Latest workflow observations and separately scoped row/cohort summaries",
        "description": "PROPOSED — NOT IMPLEMENTED. Read only; GET never acquires evidence or executes a new verification.",
        "parameters": [
          {
            "name": "evaluated_from",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "Inclusive mapped evaluation instant; RFC3339 offset required. Not service receipt/execution time."
          },
          {
            "name": "evaluated_to",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "Exclusive mapped evaluation instant; must be later than evaluated_from. Null/unmapped evaluation times excluded when filtering."
          }
        ],
        "responses": {
          "200": {
            "description": "Successful read of completed immutable data",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Overview"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "description": "Offline prototype: no-store. Later retention/cache policy needs review.",
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "400": {
            "description": "Invalid cursor, unknown parameter or unsupported sort",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Reserved future authenticated deployment: authentication required; not implemented in Phase 1",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Reserved future authenticated deployment: authorization denied; cross-workspace resource lookup uses 404",
