    "/api/v1/verifications": {
      "get": {
        "operationId": "listVerifications",
        "summary": "Completed verification runs",
        "description": "PROPOSED — NOT IMPLEMENTED. Read only; GET never acquires evidence or executes a new verification.",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 25
            },
            "description": "Maximum items per page; never implicitly truncate a complete evaluator result."
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 2048
            },
            "description": "Opaque continuation. Omit for first page. Changing filters/sort or mode with a cursor is rejected."
          },
          {
            "name": "workflow_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Filter by exact workflow ID"
          },
          {
            "name": "cohort_state",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/State"
            },
            "description": "Filter cohort verdict only, never record state"
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 200
            },
            "description": "Trim and case-insensitive substring over run ID, workflow name, n8n label and source namespace; no implicit search over PII. Skip null n8n_label values; never search derived unavailable-label fallback text."
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "evaluated_at:desc",
                "evaluated_at:asc",
                "created_at:desc"
              ],
              "default": "evaluated_at:desc"
            },
            "description": "Mapped evaluation instant or creation time. Null evaluation times last in either direction; ID tie-break in sort direction."
          },
          {
            "name": "evaluated_from",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "Inclusive mapped evaluation instant; RFC3339 offset required. Not service receipt/execution time."
          },
          {
            "name": "evaluated_to",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "Exclusive mapped evaluation instant; must be later than evaluated_from. Null/unmapped evaluation times excluded when filtering."
          }
        ],
        "responses": {
