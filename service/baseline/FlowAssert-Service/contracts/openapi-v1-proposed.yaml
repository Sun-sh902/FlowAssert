            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "description": "Pins all latest summaries, aggregates and trend to one immutable catalog view. Pass unchanged to Detail and then evidence hydration reads."
          },
          "scope": {
            "$ref": "#/components/schemas/OverviewScope"
          },
          "workflow_count": {
            "type": "integer",
            "minimum": 0
          },
          "cohort_counts": {
            "$ref": "#/components/schemas/Counts"
          },
          "record_counts": {
            "$ref": "#/components/schemas/Counts"
          },
          "last_evaluated_at": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "latest_runs": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RunSummary"
            },
            "maxItems": 100
          },
          "trend": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/TrendDay"
            }
          },
          "unbucketed_run_count": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "meta",
          "snapshot_id",
          "scope",
          "workflow_count",
          "cohort_counts",
          "record_counts",
          "last_evaluated_at",
          "latest_runs",
          "trend",
          "unbucketed_run_count"
        ],
        "additionalProperties": false,
        "description": "Latest-per-workflow aggregates and all-in-range UTC evaluation-day trends are distinct. Unknown/unmapped evaluation times are excluded from time-filter/trend calculations and reported via separate unbucketed_run_count. Empty dataset has no verification verdict. Option B hydration: latest_runs are summaries only; preserve their selection/order and fetch each full Detail by ID with snapshot_id, concurrency <=4. Render traces/exhibits only from validated complete Details; loading/failed entries are explicit unavailable slots, never fabricated records or business verdicts. All-ready requires every selected Detail; counts can display separately as snapshot summaries."
      },
      "EvidenceItem": {
        "type": "object",
        "properties": {
