          "policy_context",
          "result",
          "retry_context",
          "evidence_references",
          "assurance",
          "diagnostics",
          "snapshot_id"
        ],
        "additionalProperties": false,
        "description": "A proposed product envelope around actual evaluator output; no duplicate top-level row/cohort/rule verdicts. All five examples are synthetic specifications, not implemented service responses. Detail is complete (at most 200 source rows), in original source_row capture order; no record pagination. A summary must be hydrated by identity.id using the parent snapshot_id. Stored run identities/content are never overwritten or reused."
      },
      "RunSummary": {
        "type": "object",
        "properties": {
          "identity": {
            "$ref": "#/components/schemas/Identity"
          },
