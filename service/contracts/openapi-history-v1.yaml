{
  "openapi": "3.1.1",
  "info": {
    "title": "FlowAssert Phase 3A additive history API",
    "version": "phase3a-1.0.0",
    "description": "Local synthetic read-only archive extension. Frozen Phase0 operations unchanged. No write/delete/update/live endpoints. Internal content consistency does not authenticate external sources."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8765"
    }
  ],
  "paths": {
    "/api/v1/history": {
      "get": {
        "operationId": "listHistory",
        "description": "Descending immutable sequence with a cursor-pinned upper boundary. New inserts excluded. Total counts archive entries only. Empty list returns items=[], next_cursor=null, total=0.",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 25
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 2048
            }
          },
          {
            "name": "verification_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^SPEC-00[1-5]$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Validated local synthetic archive retrieval; not source authentication",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HistoryList"
                }
              }
            }
          },
          "400": {
            "description": "Invalid cursor/query or scope conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin outside exact local allowlist",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "History not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "405": {
            "description": "Read-only resource",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Explicit snapshot conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Malformed ID/parameter",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Sanitized internal failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Archive unavailable, schema invalid, or integrity failed/unverifiable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/api/v1/history/{history_id}": {
      "get": {
        "operationId": "getHistory",
        "description": "Complete original immutable VerificationRun nested under run. Persistent snapshot_id is distinct from run.snapshot_id (original ephemeral snapshot). Integrity failure blocks 200.",
        "parameters": [
          {
            "name": "history_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^hist_[a-f0-9]{64}$"
            }
          },
          {
            "name": "snapshot_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Validated local synthetic archive retrieval; not source authentication",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HistoryDetail"
                }
              }
            }
          },
          "400": {
            "description": "Invalid cursor/query or scope conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin outside exact local allowlist",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "History not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "405": {
            "description": "Read-only resource",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Explicit snapshot conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Malformed ID/parameter",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Sanitized internal failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Archive unavailable, schema invalid, or integrity failed/unverifiable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/api/v1/history/{history_id}/evidence": {
      "get": {
        "operationId": "getHistoryEvidence",
        "description": "Ordered references exactly match run.evidence_references. Cursor binds history/archive/database/snapshot/query. Integrity checks precede optional payload omission. Missing-at-evaluation content is explicitly unverifiable; unexpected missing content is503. No unqualified success on digest mismatch.",
        "parameters": [
          {
            "name": "history_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^hist_[a-f0-9]{64}$"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 25
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 2048
            }
          },
          {
            "name": "snapshot_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          },
          {
            "name": "include_payload",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "default": true
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Validated local synthetic archive retrieval; not source authentication",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HistoryEvidencePage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid cursor/query or scope conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin outside exact local allowlist",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "History not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "405": {
            "description": "Read-only resource",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Explicit snapshot conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Malformed ID/parameter",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Sanitized internal failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Archive unavailable, schema invalid, or integrity failed/unverifiable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": []
      }
    }
  },
  "components": {
    "schemas": {
      "State": {
        "type": "string",
        "enum": [
          "Verified",
          "Mismatch",
          "Pending",
          "Unverified"
        ]
      },
      "RuleStatus": {
        "type": "string",
        "enum": [
          "pass",
          "fail",
          "unknown"
        ]
      },
      "Digest": {
        "type": "string",
        "pattern": "^[a-f0-9]{64}$",
        "description": "SHA-256 identity only. Does not authenticate acquisition or prove truth."
      },
      "Timestamp": {
        "type": [
          "string",
          "null"
        ],
        "format": "date-time",
        "description": "RFC3339 instant with explicit offset; canonical output UTC Z; null means unavailable. Never substitute epoch/tick zero."
      },
      "RawJSON": {
        "description": "An unchanged supplied JSON value, including malformed evidence values. No coercion is authorized."
      },
      "RawTick": {
        "description": "Raw evaluator echo: normally a plain safe integer tick or null; malformed JSON values may be retained on fail-closed paths. Only validated integer ticks may be mapped to timestamps."
      },
      "Counts": {
        "type": "object",
        "properties": {
          "Verified": {
            "type": "integer",
            "minimum": 0
          },
          "Mismatch": {
            "type": "integer",
            "minimum": 0
          },
          "Pending": {
            "type": "integer",
            "minimum": 0
          },
          "Unverified": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "Verified",
          "Mismatch",
          "Pending",
          "Unverified"
        ],
        "additionalProperties": false
      },
      "Meta": {
        "type": "object",
        "properties": {
          "api_version": {
            "type": "string",
            "const": "v1"
          },
          "provider_mode": {
            "type": "string",
            "enum": [
              "LOCAL_RESEARCH",
              "LIVE"
            ],
            "description": "LIVE reserved for future authorized acquisition. Phase 1 emits LOCAL_RESEARCH only."
          },
          "synthetic": {
            "type": "boolean",
            "description": "Must be true for every Phase 1 response."
          },
          "generated_at": {
            "type": "string",
            "format": "date-time"
          },
          "contract_version": {
            "type": "string",
            "const": "0.1.1-proposed",
            "description": "Reviewed schema/provider identity; mismatches fail before mapping."
          },
          "workspace_id": {
            "type": "string",
            "minLength": 1,
            "description": "Configured workspace, including for empty collections; must match every contained run identity."
          }
        },
        "required": [
          "api_version",
          "provider_mode",
          "synthetic",
          "generated_at",
          "contract_version",
          "workspace_id"
        ],
        "additionalProperties": false
      },
      "Identity": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "workspace_id": {
            "type": "string",
            "minLength": 1
          },
          "previous_run_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "workspace_id",
          "previous_run_id",
          "created_at"
        ],
        "additionalProperties": false
      },
      "Workflow": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "name": {
            "type": "string",
            "minLength": 1
          },
          "n8n_label": {
            "type": [
              "string",
              "null"
            ],
            "description": "Required wire key. Configured string is copied verbatim; explicit null means unavailable label metadata. Missing key is a contract error. The provider preserves null and may separately derive display text \"Workflow label unavailable\"; no execution or source provenance is inferred."
          },
          "source_label": {
            "type": "string"
          },
          "source_namespace": {
            "type": "string"
          },
          "destination_system": {
            "type": "string",
            "const": "HubSpot"
          },
          "destination_object": {
            "type": "string",
            "const": "contacts"
          }
        },
        "required": [
          "id",
          "name",
          "n8n_label",
          "source_label",
          "source_namespace",
          "destination_system",
          "destination_object"
        ],
        "additionalProperties": false
      },
      "EvaluatorIdentity": {
        "type": "object",
        "properties": {
          "version_label": {
            "type": "string"
          },
          "source_commit": {
            "type": "string",
            "pattern": "^[a-f0-9]{40}$"
          },
          "model_sha256": {
            "$ref": "#/components/schemas/Digest"
          },
          "workspace_dirty": {
            "type": "boolean",
            "description": "Whole selected research checkout status; not just the evaluator file."
          }
        },
        "required": [
          "version_label",
          "source_commit",
          "model_sha256",
          "workspace_dirty"
        ],
        "additionalProperties": false
      },
      "TimeMapping": {
        "type": "object",
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "synthetic_affine_v1",
              "unmapped"
            ]
          },
          "origin_iso": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "seconds_per_tick": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1
          }
        },
        "required": [
          "kind",
          "origin_iso",
          "seconds_per_tick"
        ],
        "additionalProperties": false,
        "description": "synthetic_affine_v1 requires nonnull origin and positive integer seconds_per_tick. unmapped requires both null. This is a display mapping, not observed calendar authenticity."
      },
      "EventTimes": {
        "type": "object",
        "properties": {
          "business_obligation_at": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "observed_at": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "evaluation_at": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "deadline": {
            "$ref": "#/components/schemas/Timestamp"
          }
        },
        "required": [
          "business_obligation_at",
          "observed_at",
          "evaluation_at",
          "deadline"
        ],
        "additionalProperties": false,
        "description": "All four keys are required and nullable. Missing/invalid research ticks stay null with missing_time_tick/invalid_time_tick diagnostics at result.<field>; never zero, generated_at or service_executed_at. Valid ticks under unmapped mapping also produce null times with time_mapping_unavailable diagnostic. These are synthetic display instants, not observed wall-clock evidence."
      },
      "EvaluationContext": {
        "type": "object",
        "properties": {
          "evaluator": {
            "$ref": "#/components/schemas/EvaluatorIdentity"
          },
          "input_evidence_sha256": {
            "$ref": "#/components/schemas/Digest"
          },
          "time_mapping": {
            "$ref": "#/components/schemas/TimeMapping"
          },
          "event_times": {
            "$ref": "#/components/schemas/EventTimes"
          },
          "service_executed_at": {
            "$ref": "#/components/schemas/Timestamp"
          }
        },
        "required": [
          "evaluator",
          "input_evidence_sha256",
          "time_mapping",
          "event_times",
          "service_executed_at"
        ],
        "additionalProperties": false,
        "description": "Raw evaluator ticks remain in result. service_executed_at is actual backend execution time in an implemented service; null in these proposed static examples, which are not HTTP execution receipts."
      },
      "RuleResult": {
        "type": "object",
        "properties": {
          "status": {
            "$ref": "#/components/schemas/RuleStatus"
          },
          "reason": {
            "type": "string"
          },
          "expected": {
            "type": "string"
          },
          "actual": {
            "type": "string"
          }
        },
        "required": [
          "status",
          "reason"
        ],
        "additionalProperties": false
      },
      "RuleMap": {
        "type": "object",
        "properties": {
          "existence": {
            "$ref": "#/components/schemas/RuleResult"
          },
          "phone": {
            "$ref": "#/components/schemas/RuleResult"
          },
          "uniqueness": {
            "$ref": "#/components/schemas/RuleResult"
          },
          "existed_by_deadline": {
            "$ref": "#/components/schemas/RuleResult"
          },
          "workflow_execution": {
            "$ref": "#/components/schemas/RuleResult"
          }
        },
        "required": [
          "existence",
          "phone",
          "uniqueness"
        ],
        "additionalProperties": false,
        "description": "Only evaluator-produced required rules. Email is absent from the current evaluator contract; do not inject it or synthesize a pass."
      },
      "RecordResult": {
        "type": "object",
        "properties": {
          "key": {
            "$ref": "#/components/schemas/RawJSON"
          },
          "source_row": {
            "type": "integer",
            "minimum": 0
          },
          "state": {
            "$ref": "#/components/schemas/State"
          },
          "candidate_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "rules": {
            "$ref": "#/components/schemas/RuleMap"
          }
        },
        "required": [
          "key",
          "source_row",
          "state",
          "candidate_ids",
          "rules"
        ],
        "additionalProperties": false,
        "description": "Raw key may be duplicate, missing/null, or non-string. UI row identity is run ID plus source_row, never an assumption of unique key."
      },
      "PremiseEvidence": {
        "type": "object",
        "properties": {
          "source_provenance_record": {
            "type": "boolean"
          },
          "source_inventory_record": {
            "type": "boolean"
          },
          "rule_approval_record": {
            "type": "boolean"
          },
          "destination_query_total_consistent": {
            "type": "boolean"
          },
          "observation_clock_trusted": {
            "type": "boolean"
          }
        },
        "required": [
          "source_provenance_record",
          "source_inventory_record",
          "rule_approval_record",
          "destination_query_total_consistent",
          "observation_clock_trusted"
        ],
        "additionalProperties": false,
        "description": "Consistency checks on supplied records, not authentication. None alone establishes population, coverage, or approval."
      },
      "ResearchResult": {
        "type": "object",
        "properties": {
          "cohort_state": {
            "$ref": "#/components/schemas/State"
          },
          "counts": {
            "$ref": "#/components/schemas/Counts"
          },
          "records": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RecordResult"
            },
            "maxItems": 200
          },
          "expected_total": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          },
          "source_rows_observed": {
            "type": "integer",
            "minimum": 0
          },
          "source_population_known": {
            "type": "boolean"
          },
          "destination_coverage_sufficient": {
            "type": "boolean"
          },
          "source_basis_sha256": {
            "$ref": "#/components/schemas/Digest"
          },
          "rule_basis_sha256": {
            "$ref": "#/components/schemas/Digest"
          },
          "observed_at": {
            "$ref": "#/components/schemas/RawTick"
          },
          "deadline": {
            "$ref": "#/components/schemas/RawTick"
          },
          "business_obligation_at": {
            "$ref": "#/components/schemas/RawTick"
          },
          "evaluation_at": {
            "$ref": "#/components/schemas/RawTick"
          },
          "observation_time_valid": {
            "type": "boolean"
          },
          "destination_page_sequence_valid": {
            "type": "boolean"
          },
          "destination_page_sequence_reason": {
            "type": "string"
          },
          "premise_evidence": {
            "$ref": "#/components/schemas/PremiseEvidence"
          },
          "workflow_execution": {
            "type": "string",
            "const": "Not assessed"
          },
          "business_truth": {
            "type": "string",
            "const": "Not assessed"
          },
          "absence_cause": {
            "type": "string",
            "const": "Not inferred"
          }
        },
        "required": [
          "cohort_state",
          "counts",
          "records",
          "expected_total",
          "source_rows_observed",
          "source_population_known",
          "destination_coverage_sufficient",
          "source_basis_sha256",
          "rule_basis_sha256",
          "observed_at",
          "deadline",
          "business_obligation_at",
          "evaluation_at",
          "observation_time_valid",
          "destination_page_sequence_valid",
          "destination_page_sequence_reason",
          "premise_evidence",
          "workflow_execution",
          "business_truth",
          "absence_cause"
        ],
        "additionalProperties": false,
        "description": "Unchanged evaluate(e) return object. Transport cap of 200 source rows is an offline service scope limit, not a research capability limit. Never truncate a result; reject oversized import before publication."
      },
      "ResultSummary": {
        "type": "object",
        "properties": {
          "cohort_state": {
            "$ref": "#/components/schemas/State"
          },
          "counts": {
            "$ref": "#/components/schemas/Counts"
          },
          "expected_total": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          },
          "source_rows_observed": {
            "type": "integer",
            "minimum": 0
          },
          "source_population_known": {
            "type": "boolean"
          },
          "records_not_fully_assessed": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "cohort_state",
          "counts",
          "expected_total",
          "source_rows_observed",
          "source_population_known",
          "records_not_fully_assessed"
        ],
        "additionalProperties": false,
        "description": "Projection/count of returned rows and statuses, not cohort recomputation. Counts are row verdict counts; cohort_state is copied."
      },
      "EvidenceValue": {
        "type": "object",
        "properties": {
          "state": {
            "type": "string",
            "enum": [
              "present",
              "null",
              "missing",
              "inaccessible",
              "unsupported",
              "redacted"
            ]
          },
          "value": {
